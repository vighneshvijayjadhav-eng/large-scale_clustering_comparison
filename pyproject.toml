[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taxi-patterns"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["polars>=1.20,<2", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "umap-learn>=0.5.7,<0.6", "plotly>=5.24,<7", "streamlit>=1.41,<2", "psutil>=6,<8", "pyarrow>=18,<24", "threadpoolctl>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
taxi = "taxi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

